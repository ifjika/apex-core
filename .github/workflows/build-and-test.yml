name: APEX-Core CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Test Multi-Module Architecture
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secure_dev_password
          MYSQL_DATABASE: apex_core_db
          MYSQL_USER: apex_admin
          MYSQL_PASSWORD: secure_dev_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u apex_admin -psecure_dev_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Initialize MySQL Databases & Schemas
        run: |
          sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -P 3306 -u root -psecure_dev_password < deploy/init-db/01-create-schemas.sql

      - name: Compile and Run Unit & Integration Tests
        run: mvn clean verify -B

      - name: Publish JUnit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Results
          path: "**/surefire-reports/*.xml"
          reporter: java-junit
