version: '3.8'

services:
  # Multi-tenant Shared Database via Logical Schemas (Memory Limit: 200MB)
  postgres-apex:
    image: postgres:16-alpine
    container_name: apex-postgres
    environment:
      POSTGRES_USER: apex_admin
      POSTGRES_PASSWORD: secure_dev_password
      POSTGRES_DB: apex_core_db
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 200M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_admin -d apex_core_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache & Distributed Lock Store (Memory Limit: 80MB)
  redis-cache:
    image: redis:7-alpine
    container_name: apex-redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 80M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ultra-lightweight Kafka Protocol Broker in C++ (Memory Limit: 300MB)
  redpanda-broker:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.10
    container_name: apex-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 250M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    deploy:
      resources:
        limits:
          memory: 300M

volumes:
  postgres_data:

