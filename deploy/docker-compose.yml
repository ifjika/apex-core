version: "3.8"

services:
  # Enterprise Relational Database: MySQL 8.0 Cluster (Memory Limit: 250MB)
  mysql-apex:
    image: mysql:8.0
    container_name: apex-mysql
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=96M
      - --max-connections=100
    environment:
      MYSQL_ROOT_PASSWORD: secure_dev_password
      MYSQL_DATABASE: apex_core_db
      MYSQL_USER: apex_admin
      MYSQL_PASSWORD: secure_dev_password
    ports:
      - "3306:3306"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 250M
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "apex_admin",
          "-psecure_dev_password",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache & Distributed Lock Store (Memory Limit: 80MB)
  redis-cache:
    image: redis:7-alpine
    container_name: apex-redis
    command:
      [
        "redis-server",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 80M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ultra-lightweight Kafka Protocol Broker in C++ (Memory Limit: 300MB)
  redpanda-broker:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.10
    container_name: apex-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 250M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    deploy:
      resources:
        limits:
          memory: 300M

volumes:
  mysql_data:
